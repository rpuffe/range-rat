# The flightdeck manifest contract (v1, final — spec §6).
# The only file in this repo with app-specific infra facts. Every field here
# exists because a real deploy needed it — no speculative fields, no `image`
# (CI computes and injects the image reference per build; apps never pin one).
name: range-rat     # dns-safe service name; becomes service/log/target-group names
                     # and the URL host (https://<name>.fd.robertpuffe.com).
                     # must match ^[a-z][a-z0-9-]{0,15}$ (lowercase, starts with
                     # a letter, hyphens ok, max 16 chars — dev stacks append
                     # "-dev", so this leaves room under the 32-char
                     # target-group name limit)
port: 8080           # port the container listens on
healthcheck: /healthz  # HTTP path; must return 200 within 30s of container start
cpu: 256             # Fargate CPU units (valid cpu/memory pairs enforced by
memory: 512          # app-manifest.schema.json — 256/512 fits most demo apps)
env:                 # non-secret config only — NO secrets, tokens, or credentials
  LOG_LEVEL: info
# secrets:            # optional names only; values are operator-managed SSM
#   - API_KEY          # SecureStrings (docs/contract.md)
storage: s3-retained # crew saves (saves/<CODE>.json). Retained: versioned, and
                     # survives a stack teardown, because these are players'
                     # progress. Also makes deploys stop-then-start, which the
                     # in-memory crews need (one task owns every live range).
                     # Falls back to in-memory when STORAGE_BUCKET is unset.
# auth: cognito        # optional: per-env Cognito user pool + hosted login,
                       # ids injected as COGNITO_* env vars (docs/contract.md)
