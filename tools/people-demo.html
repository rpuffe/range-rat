<!doctype html>
<!--
  Range Rat people demo: eight people cycling through every animation mode.

  HOW TO OPEN: the game's dev server only serves web/, so serve the REPO ROOT
  (this page imports ../web/js/people.js and ../web/lib/three.module.min.js):

      cd range-rat
      npx serve .            # then open http://localhost:3000/tools/people-demo.html
      # (or: python -m http.server 8000  ->  http://localhost:8000/tools/people-demo.html)

  Drag to orbit, wheel to zoom. The dropdown forces every person into one mode.
  Swing: the white ball sits at each person's p.ball, and flies down range (-z)
  at impact (SWING_IMPACT).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Rat people demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ecbe8; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 8px; left: 8px; background: rgba(20,16,32,.7); color: #fff; padding: 8px 10px; border-radius: 8px; }
  #hud label { margin-right: 10px; }
  .tag { position: fixed; transform: translate(-50%, -100%); background: rgba(20,16,32,.65); color: #fff; padding: 2px 6px; border-radius: 6px; font-size: 11px; white-space: nowrap; pointer-events: none; }
  #err { position: fixed; bottom: 8px; left: 8px; color: #900; background: #fff; padding: 6px 10px; border-radius: 6px; display: none; }
</style>
<script type="importmap">{ "imports": { "three": "../web/lib/three.module.min.js" } }</script>
</head>
<body>
<div id="hud">
  <label>Mode <select id="mode"></select></label>
  <label><input type="checkbox" id="orbit" checked> auto-orbit</label>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { buildPerson, animatePerson, SWING_IMPACT, SWING_SECS } from '../web/js/people.js';

const errBox = document.getElementById('err');
window.addEventListener('error', e => { errBox.style.display = 'block'; errBox.textContent = String(e.message); });

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ecbe8);
scene.fog = new THREE.Fog(0x9ecbe8, 30, 80);
scene.add(new THREE.HemisphereLight(0xffffff, 0x5f8f3a, 1.6));
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.position.set(6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 10, bottom: -10, near: 1, far: 40 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x5f8f3a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// a 1 m grid of tick marks along the row so scale is readable
for (let x = -9; x <= 9; x++) {
  const tick = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 0.4), new THREE.MeshBasicMaterial({ color: 0x4f7d2e }));
  tick.rotation.x = -Math.PI / 2; tick.position.set(x, 0.01, 1.2); scene.add(tick);
}
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

// ---------------------------------------------------------------- the cast
const ROSTER = [
  { name: 'customer + iron',      opt: { seed: 1 },                          club: 'iron' },
  { name: 'customer + bucket',    opt: { seed: 2 },                          carry: 'bucket' },
  { name: 'staff + wand',         opt: { seed: 3, staff: true, shirt: 0x1f6fb5 }, carry: 'wand' },
  { name: 'clubbag + driver',     opt: { seed: 4 },                          carry: 'clubbag', club: 'driver' },
  { name: 'staff + tube',         opt: { seed: 5, staff: true },             carry: 'tube' },
  { name: 'customer + driver',    opt: { seed: 6 },                          club: 'driver' },
  { name: 'bucket + iron',        opt: { seed: 7 },                          carry: 'bucket', club: 'iron' },
  { name: 'staff + bucket',       opt: { seed: 8, staff: true },             carry: 'bucket' },
];
const SCHEDULE = [['idle', 2.2], ['walk', 3], ['carry', 3], ['address', 1.2], ['swing', SWING_SECS + 1], ['knocked', 2.4], ['cheer', 2.2], ['facepalm', 2.6]];

const tagsEl = [], cast = ROSTER.map((r, i) => {
  const p = buildPerson(r.opt);
  if (r.carry) p.setCarry(r.carry);
  if (r.club) p.setClub(true, r.club);
  p.root.position.set((i - 3.5) * 2, 0, 0);
  scene.add(p.root);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
  ball.castShadow = true; ball.visible = false; scene.add(ball);
  const tag = document.createElement('div'); tag.className = 'tag'; document.body.appendChild(tag); tagsEl.push(tag);
  return { p, r, ball, home: p.root.position.clone(), idx: i % SCHEDULE.length, tIn: i * 0.35, fly: null, name: r.name };
});

const modeSel = document.getElementById('mode');
for (const m of ['cycle', ...SCHEDULE.map(s => s[0])]) modeSel.add(new Option(m, m));

// ---------------------------------------------------------------- per-frame
const WALK = 1.4;
function stepPerson(c, dt) {
  const forced = modeSel.value !== 'cycle';
  let mode, dur;
  if (forced) { mode = modeSel.value; dur = mode === 'swing' ? SWING_SECS + 1 : 99; }
  else { [mode, dur] = SCHEDULE[c.idx]; }
  if (c.mode !== mode) { c.mode = mode; c.tIn = forced ? 0 : c.tIn; if (mode === 'address') { c.fly = null; } }
  c.tIn += dt;
  if (!forced && c.tIn >= dur) {
    c.tIn = 0; c.idx = (c.idx + 1) % SCHEDULE.length; [mode] = SCHEDULE[c.idx]; c.mode = mode;
    if (mode === 'idle') c.p.root.position.copy(c.home);     // tidy up after the walk
  }
  if (forced && mode === 'swing' && c.tIn > SWING_SECS + 1) c.tIn = 0;
  const root = c.p.root;
  // turn to face the way they walk (carry walks back toward the start)
  const wantYaw = mode === 'carry' ? Math.PI : 0;
  const dy = Math.atan2(Math.sin(wantYaw - root.rotation.y), Math.cos(wantYaw - root.rotation.y));
  root.rotation.y += Math.sign(dy) * Math.min(Math.abs(dy), 6 * dt);
  const state = { mode };
  if (mode === 'walk' || mode === 'carry') {
    state.speed = WALK;
    root.position.x -= Math.sin(root.rotation.y) * WALK * dt; root.position.z -= Math.cos(root.rotation.y) * WALK * dt;
    if (Math.abs(root.position.z - c.home.z) > 6) root.position.z = c.home.z + Math.sign(c.home.z - root.position.z) * 5.9;
  }
  if (mode === 'swing') state.k = Math.min(1, c.tIn / SWING_SECS);
  animatePerson(c.p, dt, state);

  // the ball: sits at p.ball during address/swing, flies down range at impact
  const b = c.ball;
  if (mode === 'address' || mode === 'swing') {
    b.visible = true;
    if (mode === 'swing' && state.k >= SWING_IMPACT) {
      if (!c.fly) c.fly = { t: 0, from: root.localToWorld(c.p.ball.clone()), dir: new THREE.Vector3(0, 0, -1).applyQuaternion(root.quaternion) };
      c.fly.t += dt;
      b.position.copy(c.fly.from).addScaledVector(c.fly.dir, 14 * c.fly.t); b.position.y = 0.04 + 6 * c.fly.t - 5 * c.fly.t * c.fly.t;
      if (b.position.y < 0.04) b.position.y = 0.04;
    } else { b.position.copy(root.localToWorld(c.p.ball.clone())); b.position.y = 0.04; c.fly = null; }
  } else if (c.fly && c.fly.t < 1.4 && mode !== 'idle') {
    c.fly.t += dt; b.position.addScaledVector(c.fly.dir, 14 * dt); b.position.y = Math.max(0.04, 0.04 + 6 * c.fly.t - 5 * c.fly.t * c.fly.t);
  } else { b.visible = false; c.fly = null; }
}

// ---------------------------------------------------------------- orbit camera
let yaw = 0.35, pitch = 0.2, dist = 15, drag = null, auto = true;
const orbitBox = document.getElementById('orbit');
orbitBox.onchange = () => { auto = orbitBox.checked; };
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.min(1.3, Math.max(0.02, pitch + (e.clientY - drag.y) * 0.006));
  drag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => { dist = Math.min(40, Math.max(4, dist * (1 + Math.sign(e.deltaY) * 0.08))); e.preventDefault(); }, { passive: false });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const _v = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const c of cast) stepPerson(c, dt);
  if (auto && !drag) yaw += dt * 0.12;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, 1 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, 1, 0);
  renderer.render(scene, camera);
  cast.forEach((c, i) => {
    _v.copy(c.p.root.position); _v.y = 2.1; _v.project(camera);
    const el = tagsEl[i], vis = _v.z < 1;
    el.style.display = vis ? '' : 'none';
    el.style.left = ((_v.x * 0.5 + 0.5) * innerWidth) + 'px'; el.style.top = ((-_v.y * 0.5 + 0.5) * innerHeight) + 'px';
    el.textContent = `${c.name}: ${c.mode}`;
  });
});
</script>
</body>
</html>
