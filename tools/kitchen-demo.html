<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen demo</title>
<style>
  :root { --ink: #fff8ec; --dim: #e8d6bd; --panel: rgba(28, 22, 40, 0.82); --accent: #ffb347; --bad: #ff8a7a; }
  html, body { margin: 0; height: 100%; background: #1e1c38; color: var(--ink); font: 600 16px system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 8px; left: 8px; z-index: 100; display: flex; gap: 10px; align-items: center; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 2px solid var(--accent); background: var(--panel); color: var(--ink); cursor: pointer; }
  #log { position: fixed; bottom: 8px; left: 8px; z-index: 100; color: var(--dim); font-size: 14px; white-space: pre; }
</style></head>
<body>
<div id="bar"><button id="open">Open kitchen</button><span>Esc / pad B closes. Plug in a pad for Ⓐ hints.</span></div>
<div id="log"></div>
<script type="module">
import { createKitchen } from '../web/js/kitchen.js';
import { readPad } from '../web/js/pad.js';
const log = document.getElementById('log'), lines = [];
let ac;
const beep = (f, d = 0.08, type = 'square') => { try { ac ??= new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = 0.04; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch {} };
const F = { peel: 600, chop: 160, 'sizzle-on': 900, 'sizzle-off': 300, ding: 1320, salt: 1000, serve: 440 };
const k = createKitchen({
  root: document.body,
  onSound: n => beep(F[n] ?? 500, n === 'ding' ? 0.3 : 0.07, n === 'ding' ? 'sine' : 'square'),
  onServe: r => { lines.unshift(JSON.stringify(r)); log.textContent = lines.slice(0, 6).join('\n'); },
});
document.getElementById('open').onclick = () => k.open();
addEventListener('pointerdown', e => { if (e.target.id !== 'open') k.handlePointer('down', e); });
addEventListener('pointermove', e => k.handlePointer('move', e));
addEventListener('pointerup', e => k.handlePointer('up', e));
addEventListener('keydown', e => { if (k.handleKey('down', e)) e.preventDefault(); });
addEventListener('keyup', e => k.handleKey('up', e));
let prev = null, last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  const pad = readPad(navigator.getGamepads?.(), prev); prev = pad;
  document.body.classList.toggle('pad', !!pad);
  if (k.isOpen) { k.stepPad(pad, dt); k.tick(dt); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
k.open();
</script></body></html>
