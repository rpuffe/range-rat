<!doctype html>
<!--
  Range Rat crowd demo: the whole customer lifecycle on a fake server clock.
  Customers walk in from the gate (-3, 9.5) along the path, grab a bucket at the stand,
  set it down at their mat, hit balls (each ball fires crowd.onMatShot), then walk out.
  "Muddy" a mat to see a refusal: sulk 2 s, leave, the mat stays empty 30 s.

  HOW TO OPEN: serve the REPO ROOT (the page imports ../web/js and ../web/lib):
      cd range-rat
      npx serve .       # then http://localhost:3000/tools/crowd-demo.html
  Drag to orbit, wheel to zoom. Speed multiplies the clock (walks stay 1.3 m/s of game time).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Rat crowd demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ecbe8; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 8px; left: 8px; background: rgba(20,16,32,.75); color: #fff; padding: 8px 10px; border-radius: 8px; max-width: 360px; }
  #hud button, #hud select { margin: 2px 2px 2px 0; }
  #mats { margin-top: 6px; font: 11px ui-monospace, monospace; white-space: pre; }
  #err { position: fixed; bottom: 8px; left: 8px; color: #900; background: #fff; padding: 6px 10px; border-radius: 6px; display: none; }
</style>
<script type="importmap">{ "imports": { "three": "../web/lib/three.module.min.js" } }</script>
</head>
<body>
<div id="hud">
  <div>
    <label>Speed <select id="speed"><option>1</option><option>3</option><option selected>5</option></select>x</label>
    <label>Open mats <select id="open"></select></label>
    <label>Club <input type="checkbox" id="club"> 50-ball buckets</label>
  </div>
  <div>
    <button data-cam="mats">Mats</button><button data-cam="gate">Gate</button><button data-cam="stand">Stand</button><button data-cam="all">Overview</button>
    <button id="restart">Open the shift</button>
  </div>
  <div>Click a mat's button to make it filthy (mud 1) or clean:</div>
  <div id="mudBtns"></div>
  <div id="mats"></div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import * as people from '../web/js/people.js';
import { createCrowd } from '../web/js/crowd.js';
import { MATS, mulberry32 } from '../web/js/sim.js';
import { CUST, ENTRANCE_PATH, GATE, newMat, stepMat, matReady, shoot, openShift, matWire } from '../web/js/customers.js';

const errBox = document.getElementById('err');
window.addEventListener('error', e => { errBox.style.display = 'block'; errBox.textContent = String(e.message); });

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ecbe8);
scene.fog = new THREE.Fog(0x9ecbe8, 60, 160);
scene.add(new THREE.HemisphereLight(0xffffff, 0x5f8f3a, 1.7));
const sun = new THREE.DirectionalLight(0xfff2d6, 2); sun.position.set(10, 20, 14); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x5f8f3a }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);

// the walkway, the gate posts, the stand, the mats
const lam = c => new THREE.MeshLambertMaterial({ color: c });
for (let i = 1; i < ENTRANCE_PATH.length; i++) {
  const [ax, az] = ENTRANCE_PATH[i - 1], [bx, bz] = ENTRANCE_PATH[i], L = Math.hypot(bx - ax, bz - az);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(L + 2, 2.2), lam(0xb9b2a0));
  s.rotation.order = 'YXZ'; s.rotation.x = -Math.PI / 2; s.rotation.y = -Math.atan2(bz - az, bx - ax); s.position.set((ax + bx) / 2, 0.02, (az + bz) / 2);
  scene.add(s);
}
for (const dx of [-4.4, 4.4]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.2, 0.6), lam(0x2f5d3a)); p.position.set(GATE.x + dx, 2.6, GATE.z); scene.add(p); }
const arch = new THREE.Mesh(new THREE.BoxGeometry(9.8, 1.2, 0.3), lam(0x23472c)); arch.position.set(GATE.x, 5.4, GATE.z); scene.add(arch);
const stand = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1.2), lam(0x8a5a32)); stand.position.set(26, 0.5, 6); scene.add(stand);
const matMeshes = MATS.map(m => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.04, 1.6), lam(0x2f6b2a)); mesh.position.set(m.x, 0.02, 0); scene.add(mesh); return mesh;
});

const crowd = createCrowd({ scene, people });

// ---- a stand-in server: the same calls crew.mjs makes ---------------------------------
const mats = MATS.map(m => newMat(m.i));
const mud = MATS.map(() => 0);
let now = 100, nOpen = 4, nextCust = 0, venue = 0;
const rng = mulberry32(42), ids = () => ++nextCust;
const balls = [], nextShot = MATS.map(() => 0);
const ball = new THREE.SphereGeometry(0.06, 8, 6), ballMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const openSel = document.getElementById('open');
for (let n = 1; n <= MATS.length; n++) openSel.add(new Option(n, n, n === 4, n === 4));
const mudBtns = document.getElementById('mudBtns');
MATS.forEach((m, i) => {
  const b = document.createElement('button'); b.textContent = i;
  b.onclick = () => { mud[i] = mud[i] >= 0.9 ? 0 : 1; b.style.background = mud[i] ? '#b5651d' : ''; matMeshes[i].material.color.set(mud[i] ? 0x6b4a2a : 0x2f6b2a); };
  mudBtns.appendChild(b);
});
function start() {
  crowd.clear();
  openShift(mats, { now, rng, venue, nOpen, nextCust: ids });
  nextShot.fill(now + 2);
}
document.getElementById('restart').onclick = start;
openSel.onchange = () => { nOpen = +openSel.value; };
document.getElementById('club').onchange = e => { venue = e.target.checked ? 1 : 0; start(); };
start();

function serverStep(dt) {
  now += dt;
  mats.forEach((m, i) => {
    stepMat(m, dt, { now, rng, venue, mud: mud[i], open: i < nOpen, gap: 8, nextCust: ids });
    if (now >= nextShot[i]) {
      if (matReady(m, now)) {            // the per-mat ball timer: only while 'playing' and the bucket isn't empty
        shoot(m, now); crowd.onMatShot(i);
        const aim = (rng() - 0.5) * 0.3, sp = 20 + rng() * 12;
        balls.push({ mesh: new THREE.Mesh(ball, ballMat), x: MATS[i].x, y: 0.1, z: -0.4, vx: Math.sin(aim) * sp * 0.7, vy: sp * 0.4, vz: -Math.cos(aim) * sp * 0.7, t0: 0.9 });
        scene.add(balls.at(-1).mesh);
      }
      nextShot[i] = now + 4 + rng() * 8;
    }
  });
}
let snapT = 0;
function snapshot() { crowd.sync(mats.map(matWire), now); }

const hudMats = document.getElementById('mats');
function hud() {
  hudMats.textContent = mats.map((m, i) => `${i} ${i < nOpen ? ' ' : 'x'} ${m.st.padEnd(7)} ${String(m.balls).padStart(2)} left  ${m.inc ? 'inc ' + m.inc.cust : ''}`).join('\n')
    + `\nfigures ${JSON.stringify(crowd.stats())}`;
}

// ---- camera ------------------------------------------------------------------------------
const VIEWS = { mats: [0, 1, 0, 0.3, 0.25, 26], gate: [-3, 1, 14, 0.5, 0.25, 22], stand: [22, 1, 4, -0.7, 0.25, 16], all: [4, 0, 10, 0.6, 0.55, 62] };
let tx = 4, ty = 0, tz = 10, yaw = 0.6, pitch = 0.55, dist = 62, drag = null;
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => { [tx, ty, tz, yaw, pitch, dist] = VIEWS[b.dataset.cam]; });
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.min(1.4, Math.max(0.03, pitch + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => { dist = Math.min(150, Math.max(5, dist * (1 + Math.sign(e.deltaY) * 0.08))); e.preventDefault(); }, { passive: false });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now(), hudT = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const k = +document.getElementById('speed').value;
  // the server ticks at 20 Hz of game time; the crowd sees snapshots ~5 Hz
  let rem = dt * k;
  while (rem > 0) { const s = Math.min(rem, 0.05); serverStep(s); rem -= s; }
  if ((snapT -= dt) <= 0) { snapT = 0.2; snapshot(); }
  crowd.update(dt * k, camera);
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i], d = dt * k;
    b.vy -= 9.81 * d; b.x += b.vx * d; b.y += b.vy * d; b.z += b.vz * d;
    b.mesh.position.set(b.x, Math.max(0.06, b.y), b.z);
    if (b.y < 0) { scene.remove(b.mesh); balls.splice(i, 1); }
  }
  camera.position.set(tx + Math.sin(yaw) * Math.cos(pitch) * dist, ty + 1 + Math.sin(pitch) * dist, tz + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(tx, ty + 1, tz);
  renderer.render(scene, camera);
  if ((hudT -= dt) <= 0) { hudT = 0.3; hud(); }
});
window.demo = { mats, crowd, mud };
</script>
</body>
</html>
